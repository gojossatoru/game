name: Build Windows game
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LittleBoar game.py
      - uses: actions/upload-artifact@v4
        with:
          name: LittleBoar-Windows
          path: dist/LittleBoar.exe
